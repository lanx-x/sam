packages:
  - apps/*

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - core-js-pure
  - esbuild

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@qkix/better-blocks-core@0.2.5'
  - '@qkix/better-blocks-react-renderer@0.18.6'
  - '@qkix/strapi-plugin-better-blocks@0.23.6'
